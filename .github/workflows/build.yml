name: Build and test

on:
  push:
    branches: [main, "maintenance/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore UniversalPCDoctor.slnx

      - name: Build
        run: dotnet build UniversalPCDoctor.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test UniversalPCDoctor.slnx --configuration Release --no-build

      - name: Publish preview
        run: dotnet publish src/UPCD.App/UPCD.App.csproj --configuration Release --no-build --no-restore --output artifacts/UPCD

      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: UPCD-preview-windows-x64
          path: artifacts/UPCD/
          if-no-files-found: error
          retention-days: 7
